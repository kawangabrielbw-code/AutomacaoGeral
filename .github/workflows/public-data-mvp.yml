name: Public data pipeline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

jobs:
  public-data-mvp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install requests pandas openpyxl
      - name: Run focused public data pipeline tests
        run: python -m unittest tests.test_public_data_pipeline_mvp -v
